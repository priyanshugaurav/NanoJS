name: Build and Release NanoJS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact_name: nanojs-linux-x64
            binary_name: nanojs
          - os: windows-latest
            target: windows-x64
            artifact_name: nanojs-windows-x64.exe
            binary_name: nanojs.exe
          - os: macos-latest
            target: macos-universal
            artifact_name: nanojs-macos-universal
            binary_name: nanojs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build for Linux
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -O3 -Iinclude src/*.cpp src/runtime/*.cpp -o nanojs
          chmod +x nanojs
          ./nanojs examples/test_01_basics.mjs
          tar -czvf nanojs-v1.0.0-linux-x64.tar.gz nanojs

      # Build for Windows
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: |
          g++ -std=c++17 -O3 -Iinclude src/*.cpp src/runtime/*.cpp -o nanojs.exe -lws2_32
          .\nanojs.exe examples/test_01_basics.mjs
          Compress-Archive -Path nanojs.exe -DestinationPath nanojs-v1.0.0-windows-x64.zip

      # Build for macOS (Universal Binary)
      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          clang++ -target arm64-apple-macos11 -std=c++17 -O3 -Iinclude src/*.cpp src/runtime/*.cpp -o nanojs-arm64
          clang++ -target x86_64-apple-macos11 -std=c++17 -O3 -Iinclude src/*.cpp src/runtime/*.cpp -o nanojs-x64
          lipo -create -output nanojs nanojs-arm64 nanojs-x64
          chmod +x nanojs
          ./nanojs examples/test_01_basics.mjs
          tar -czvf nanojs-v1.0.0-macos-universal.tar.gz nanojs

      - name: Run Test Suite
        shell: bash
        run: |
          python3 scripts/test_engine.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanojs-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
            ${{ matrix.binary_name }}
